[package]
name = "workerw-proof"
version = "0.1.0"
edition = "2021"

[lib]
name = "workerw_proof_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
