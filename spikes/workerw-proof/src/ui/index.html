<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      #circle {
        position: absolute;
        left: 80px;
        top: 80px;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #7ef9ff, #4facfe 60%, #0a2a6b);
        transform: rotate(45deg);
        box-shadow: 0 0 60px rgba(80, 180, 255, 0.9);
      }
      #tag {
        position: absolute;
        left: 8px;
        top: 8px;
        font: 12px monospace;
        color: #cfd8ff;
        opacity: 0.8;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="tag">workerw-proof · cercle 45°</div>
    <div id="circle"></div>
  </body>
</html>
